name = "nexus-notes-public-beta-preview"
main = "src/index.ts"
compatibility_date = "2026-08-20"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

[triggers]
crons = ["*/1 * * * *"]

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/*"]

[vars]
APP_NAME = "Nexus Notes Beta Preview"
APP_BASE_URL = "https://nexus-notes-public-beta-preview.example.workers.dev"
AI_ENABLED = "false"
AI_CHAT_API_URL = "https://provider.example/v1/chat/completions"
AI_CHAT_MODEL = "provider-model"
CORS_ALLOWED_ORIGINS = "https://nexus-notes-public-beta-preview.example.workers.dev"
GOOGLE_CALENDAR_REDIRECT_URI = "https://nexus-notes-public-beta-preview.example.workers.dev/api/v2/calendar/oauth/google/callback"
OUTLOOK_CALENDAR_REDIRECT_URI = "https://nexus-notes-public-beta-preview.example.workers.dev/api/v2/calendar/oauth/outlook/callback"
DEPLOYMENT_VERSION = "development"
EMAIL_FROM = "Nexus Notes <noreply@your-verified-domain.example>"

# Optional OAuth secrets. Store these with `wrangler secret put`, never in this file:
# GOOGLE_CALENDAR_CLIENT_ID, GOOGLE_CALENDAR_CLIENT_SECRET
# OUTLOOK_CALENDAR_CLIENT_ID, OUTLOOK_CALENDAR_CLIENT_SECRET

[[d1_databases]]
binding = "DB"
database_name = "nexus-notes-public-beta-preview"
database_id = "<PREVIEW_D1_DATABASE_ID>"

[[r2_buckets]]
binding = "FILES"
bucket_name = "nexus-notes-public-beta-preview-files"

[ai]
binding = "AI"

[[queues.producers]]
binding = "JOBS"
queue = "nexus-notes-public-beta-preview-jobs"

[[queues.consumers]]
queue = "nexus-notes-public-beta-preview-jobs"
max_batch_size = 10
max_batch_timeout = 5

[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "PresenceRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PresenceRoom"]

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "nexus_notes_public_beta_preview"
