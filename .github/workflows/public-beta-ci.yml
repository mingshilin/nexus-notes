name: Public Beta CI

on:
  pull_request:
  push:
    branches:
      - codex/public-beta-rewrite

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run beta:lint
      - run: npm run beta:test
      - run: npm run beta:build
      - run: npm audit --omit=dev
